<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Openloop Credentials</title>
  </head>
  <body class="credentials-prompt">
    <main aria-labelledby="credentials-title">
      <header>
        <p class="eyebrow">Openloop</p>
        <h1 id="credentials-title">Credential</h1>
      </header>
      <form id="credentials-form" autocomplete="off">
        <label for="credential-secret">Secret</label>
        <input
          id="credential-secret"
          name="credential-secret"
          type="password"
          autocomplete="new-password"
          maxlength="16384"
          required
          autofocus
        >
        <div class="actions">
          <button id="credential-remove" type="button" class="secondary">Remove</button>
          <button id="credential-save" type="submit">Save</button>
        </div>
      </form>
      <output id="credential-status" aria-live="polite">Checking status</output>
    </main>
    <script type="module" src="/src/credentials.ts"></script>
  </body>
</html>
