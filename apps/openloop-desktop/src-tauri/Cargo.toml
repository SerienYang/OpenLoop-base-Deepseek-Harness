[package]
name = "openloop-desktop"
version = "0.1.0"
description = "Openloop desktop foundation"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[features]
openloop-e2e = []

[lib]
name = "openloop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "build_contract"
path = "tests/build_contract.rs"

[build-dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
flate2 = "=1.1.9"
getrandom = "=0.3.4"
libc = "=0.2.189"
minisign-verify = "=0.2.5"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tar = "=0.4.46"
tauri = { version = "=2.11.5", features = ["unstable", "macos-proxy"] }
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["rustls-tls"] }
url = "=2.5.8"
uuid = { version = "=1.24.1", features = ["v4"] }
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[dev-dependencies]
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["test"] }
tauri-build = { version = "=2.6.3", features = [] }
tempfile = "=3.27.0"
