- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
- insert:
    - id: openloop-bootstrap
      name: '@openloop/bundle/bootstrap-host'
      inject: [webServer, runtimeBootstrap]
- insert:
    - id: chat-zoom
      name: '@openloop/chat-zoom'
