- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
- id: connection
  inject: [webRuntime, browserApiPolicy]
- id: typert-gateway
  inject: [browserApiPolicy]
- id: session-log-download
  disabled: true
- id: credentials
  disabled: true
- id: code-runtime
  disabled: true
- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: tool-bash
