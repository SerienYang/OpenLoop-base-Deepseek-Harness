- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
- id: llm-pi-ai
  config:
    providers:
      volcengine-agent-plan:
        displayName: 火山方舟 Agent Plan
        apiKeyEnv: VOLCENGINE_ARK_AGENT_PLAN_API_KEY
        credentialMode: bearer
        api: openai-responses
        baseURL: https://ark.cn-beijing.volces.com/api/plan/v3
        models:
          - id: ark-code-latest
            name: ark-code-latest
            contextWindow: 256000
            maxTokens: 32000
            input: [text, image]
          - id: doubao-seed-2.1-turbo
            name: doubao-seed-2.1-turbo
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: doubao-seed-evolving
            name: doubao-seed-evolving
            contextWindow: 1024000
            maxTokens: 65536
            input: [text, image]
          - id: glm-5.3
            name: glm-5.3
            contextWindow: 1024000
            maxTokens: 65536
            input: [text]
          - id: glm-5.3-flash
            name: glm-5.3-flash
            contextWindow: 1024000
            maxTokens: 65536
            input: [text, image]
          - id: glm-latest
            name: glm-latest
            contextWindow: 1024000
            maxTokens: 65536
            input: [text]
          - id: deepseek-v4-flash
            name: deepseek-v4-flash
            contextWindow: 1024000
            maxTokens: 65536
            input: [text]
          - id: deepseek-v4-pro
            name: deepseek-v4-pro
            contextWindow: 1024000
            maxTokens: 65536
            input: [text]
          - id: doubao-seed-2.0-lite
            name: doubao-seed-2.0-lite
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: doubao-seed-2.0-mini
            name: doubao-seed-2.0-mini
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: minimax-m3
            name: minimax-m3
            contextWindow: 1024000
            maxTokens: 65536
            input: [text, image]
          - id: kimi-k2.7-code
            name: kimi-k2.7-code
            contextWindow: 256000
            maxTokens: 32000
            input: [text, image]
          - id: kimi-k3
            name: kimi-k3
            contextWindow: 1024000
            maxTokens: 65536
            input: [text, image]
- insert:
    - id: openloop-bootstrap
      name: '@openloop/bundle/bootstrap-host'
      inject: [webServer, runtimeBootstrap]
- insert:
    - id: chat-zoom
      name: '@openloop/chat-zoom'
