- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
- id: connection
  inject: [webRuntime, browserApiPolicy]
- id: typert-gateway
  inject: [browserApiPolicy]
- id: credentials
  disabled: true
- id: llm-deepseek
  inject: [llm, credentialConsumers]
- id: llm-pi-ai
  inject: [llm, credentialConsumers]
- id: web-search-deepseek
  inject: [web, credentialConsumers]
- id: cordis-client-runner
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-workspace
  disabled: true
- id: ui-settings
  disabled: true
- id: ui-settings-general
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: fs-sandbox
  disabled: true
- id: tool-fs-search
  disabled: true
- id: agent-presets
  config:
    default: standard
    patches:
      - id: tool-fs-search
        disabled: true
      - id: filesystem
        isolate: null
      - id: fs-local
        disabled: true
- insert:
    - id: desktop-bridge-host
      name: '@openloop/desktop-bridge-host'
      inject: [runtimeBootstrap]
    - id: credentials-keychain
      name: '@openloop/credentials-keychain'
      inject: [desktopBridge]
    - id: openloop-bootstrap
      name: '@openloop/bundle/bootstrap-host'
      inject: [credentials, desktopBridge, webServer, runtimeBootstrap]
- insert:
    - id: workspace-authority
      name: '@openloop/workspace-authority'
      inject: [workspaceRegistry, desktopBridge]
- insert:
    - id: file-broker
      name: '@openloop/file-broker'
      inject: [desktopBridge]
- insert:
    - id: fs-workspace
      name: '@openloop/fs-workspace'
      inject: [fileBroker, workspaceRegistry, sandboxPolicy]
