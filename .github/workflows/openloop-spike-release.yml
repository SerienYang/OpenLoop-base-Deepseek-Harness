name: OpenLoop Test Update Spike Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable prerelease tag; use openloop-test-a-vVERSION or openloop-test-b-vVERSION.
        required: true
        type: string
      app_version:
        description: Exact semver embedded in the core manifest, Tauri app, DMG, and updater.
        required: true
        type: string
      release_notes:
        description: Non-empty release and updater notes.
        required: true
        type: string
      update_rolling_manifest:
        description: Replace the fixed test manifest after publishing this immutable prerelease.
        required: true
        default: true
        type: boolean

concurrency:
  group: openloop-test-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-test:
    if: github.repository == 'SerienYang/OpenLoop-base-Deepseek-Harness'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ inputs.app_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.OPENLOOP_TEST_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.OPENLOOP_TEST_UPDATER_PRIVATE_KEY_PASSWORD }}
      OPENLOOP_UPDATER_PUBLIC_KEY: ${{ vars.OPENLOOP_TEST_UPDATER_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Validate isolated test release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$GITHUB_REPOSITORY" = SerienYang/OpenLoop-base-Deepseek-Harness
          test "$(git remote get-url origin)" = https://github.com/SerienYang/OpenLoop-base-Deepseek-Harness
          [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] \
            || { echo "app_version must be valid semver" >&2; exit 1; }
          # release_tag must match openloop-test-[ab]-vVERSION exactly.
          [[ "$RELEASE_TAG" =~ ^openloop-test-([ab])-v ]] \
            || { echo "release_tag must be an A/B test tag" >&2; exit 1; }
          test "$RELEASE_TAG" = "openloop-test-${BASH_REMATCH[1]}-v${APP_VERSION}"
          [[ "$RELEASE_TAG" != *stable* ]] \
            || { echo "stable release tags are forbidden in this workflow" >&2; exit 1; }
          test -n "${RELEASE_NOTES//[[:space:]]/}" \
            || { echo "release_notes must be non-empty" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" \
            || { echo "TAURI_SIGNING_PRIVATE_KEY must be configured" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be configured" >&2; exit 1; }
          test -n "$OPENLOOP_UPDATER_PUBLIC_KEY" \
            || { echo "OPENLOOP_UPDATER_PUBLIC_KEY must be configured" >&2; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "immutable prerelease $RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the workspace-local desktop version
        run: pnpm --dir apps/openloop-desktop pkg set version="$APP_VERSION"

      - name: Build and verify the signed test desktop
        run: pnpm openloop:build-desktop -- --channel test --target aarch64-apple-darwin --bundle all

      - name: Render the signed static test manifest
        shell: bash
        run: |
          set -euo pipefail
          updater="apps/openloop-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Openloop.app.tar.gz"
          signature="${updater}.sig"
          dmg="apps/openloop-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Openloop_${APP_VERSION}_aarch64.dmg"
          test -f "$updater"
          test -s "$signature"
          test -f "$dmg"
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Openloop.app.tar.gz"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/openloop/render-update-manifest.mjs \
            --version "$APP_VERSION" \
            --artifact-url "$artifact_url" \
            --signature "$signature" \
            --notes "$RELEASE_NOTES" \
            --pub-date "$pub_date" \
            --out dist-openloop/latest-test-k1.json

      - name: Publish immutable A/B prerelease
        shell: bash
        run: |
          set -euo pipefail
          updater="apps/openloop-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Openloop.app.tar.gz"
          signature="apps/openloop-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Openloop.app.tar.gz.sig"
          dmg="apps/openloop-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Openloop_${APP_VERSION}_aarch64.dmg"
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "OpenLoop test ${APP_VERSION}" \
            --notes "$RELEASE_NOTES" \
            --prerelease \
            "$updater" \
            "$signature" \
            "$dmg" \
            dist-openloop/openloop-core.json \
            dist-openloop/openloop-artifacts.json \
            dist-openloop/openloop-runtime-sbom-inputs.json

      - name: Publish deterministic rolling test manifest
        if: inputs.update_rolling_manifest
        shell: bash
        run: |
          set -euo pipefail
          rolling_tag="openloop-test-rolling"
          # A fixed prerelease tag is intentional because GitHub's latest-release lookup excludes prereleases.
          if ! gh release view "$rolling_tag" >/dev/null 2>&1; then
            gh release create "$rolling_tag" \
              --target "$GITHUB_SHA" \
              --title "OpenLoop rolling test updater" \
              --notes "Rolling manifest for signed OpenLoop test-channel A/B validation." \
              --prerelease
          fi
          gh release upload "$rolling_tag" \
            dist-openloop/latest-test-k1.json \
            --clobber
          test "https://github.com/${GITHUB_REPOSITORY}/releases/download/openloop-test-rolling/latest-test-k1.json" \
            = "https://github.com/SerienYang/OpenLoop-base-Deepseek-Harness/releases/download/openloop-test-rolling/latest-test-k1.json"
