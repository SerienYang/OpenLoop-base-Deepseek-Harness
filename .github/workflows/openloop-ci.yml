name: OpenLoop CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node 24 / build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public repository layout
        run: pnpm run verify:repository-layout

      - name: Verify OpenLoop brand tokens
        run: pnpm run verify:brand-tokens

      - name: Verify dependency and source usage
        run: pnpm run knip

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:contracts-ready

      - name: Verify Client slot catalog
        run: pnpm run verify-client-catalog

      - name: Verify Cordis inspect catalogs
        run: pnpm run verify-cordis-inspect-catalog

      - name: Verify Session event vocabulary
        run: pnpm run verify-session-event-types

      - name: Verify third-party notices
        run: pnpm run verify-third-party-notices

      - name: Verify bilingual README pairs
        run: pnpm run verify-translation-pairing

      - name: Build
        run: pnpm run build

      - name: Test Node workspaces
        run: pnpm run test

      - name: Verify runtime closure
        run: pnpm run verify-runtime-closure

      - name: Verify package licenses
        run: pnpm run verify-dsh-package-licenses

      - name: Test native workspace
        run: pnpm --dir native/landlock-run test

      - name: Test OpenLoop desktop Rust crate
        run: cargo test --manifest-path apps/openloop-desktop/src-tauri/Cargo.toml --locked

  python:
    name: Python 3.10 / SDK
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - name: Test Python SDK
        run: uv run --python 3.10 --group test --project python/sdk pytest
